<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StocksAI Chart</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="terminal">
      <section class="chart-panel">
        <header class="top-strip">
          <form id="search-form" class="symbol-search" autocomplete="off">
            <label class="sr-only" for="symbol-input">Search ticker</label>
            <input id="symbol-input" value="AAPL" placeholder="Search NYSE or Nasdaq" spellcheck="false" list="symbol-options">
            <datalist id="symbol-options"></datalist>
            <button type="submit">Search</button>
          </form>

          <div class="identity">
            <span id="quote-name">Apple Inc.</span>
            <strong id="quote-symbol">AAPL</strong>
            <span id="quote-range">1D</span>
            <span id="exchange">NASDAQ</span>
          </div>

          <div class="ohlc">
            <span>O <strong id="ohlc-open">--</strong></span>
            <span>H <strong id="ohlc-high">--</strong></span>
            <span>L <strong id="ohlc-low">--</strong></span>
            <span>C <strong id="ohlc-close">--</strong></span>
            <span id="ohlc-change" class="quote-change">--</span>
          </div>
        </header>

        <div class="trade-row">
          <span class="volume-label">Vol <strong id="volume-value">--</strong></span>
          <span class="volume-label">Universe <strong>NYSE + Nasdaq</strong></span>
          <span class="volume-label"><span id="candle-label">Next candle</span> <strong id="candle-timer">--:--</strong></span>
          <span id="market-state" class="market-state">Loading</span>
        </div>

        <div class="range-buttons" aria-label="Candle interval">
          <button data-interval="1m" class="active" type="button">1m</button>
          <button data-interval="5m" type="button">5m</button>
          <button data-interval="10m" type="button">10m</button>
          <button data-interval="15m" type="button">15m</button>
          <button data-interval="1h" type="button">1H</button>
        </div>

        <div class="workspace-tools" aria-label="Chart workspace tools">
          <div class="tool-group">
            <button data-tool="cursor" class="active" type="button">Crosshair</button>
            <button data-tool="box" type="button">Box</button>
            <button data-tool="level" type="button">Level</button>
            <button data-tool="trend" type="button">Trend</button>
            <button data-tool="text" type="button">Text</button>
            <button id="clear-drawings" type="button">Clear</button>
          </div>

          <form id="compare-form" class="compare-form" autocomplete="off">
            <label class="sr-only" for="compare-input">Compare ticker</label>
            <input id="compare-input" placeholder="Compare symbol" list="symbol-options" spellcheck="false">
            <button type="submit">Compare</button>
            <button id="clear-compare" type="button">Remove</button>
          </form>

          <div class="tool-group">
            <label><input id="ema9-toggle" type="checkbox" checked> EMA 9</label>
            <label><input id="ema21-toggle" type="checkbox" checked> EMA 21</label>
            <label><input id="vwap-toggle" type="checkbox"> VWAP</label>
          </div>

          <label class="scale-control">Scale
            <input id="scale-input" type="range" min="0.04" max="0.6" step="0.02" value="0.12">
          </label>
        </div>

        <div class="canvas-shell">
          <canvas id="price-chart" aria-label="Candlestick stock chart"></canvas>
          <div id="data-window" class="data-window">Move over chart</div>
          <div class="watermark">StocksAI</div>
        </div>

        <footer class="bottom-strip">
          <div id="status">Loading AAPL...</div>
          <div id="watchlist" class="watchlist"></div>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
